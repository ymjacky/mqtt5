name: ci

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: check format
        run: deno fmt --check

      - name: check linting
        run: deno lint

      - name: type check
        run: deno task tsc

      - name: check publish
        run: deno publish --dry-run

      - name: run tests generating coverage
        run: deno task test
