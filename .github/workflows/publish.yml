name: Publish
on:
  # Publish to JSR only when a GitHub Release is published, so merging a
  # version bump into main does not publish a half-finished release.
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # write: attach the browser bundle to the release
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: check that the release tag matches the package version
        run: |
          version=$(grep -m1 '"version"' deno.jsonc | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ "${{ github.event.release.tag_name }}" != "${version}" ]; then
            echo "release tag ${{ github.event.release.tag_name }} does not match deno.jsonc version ${version}"
            exit 1
          fi

      # Build before publishing so a broken bundle stops the release early.
      - name: build the browser bundle
        run: deno task build_ems

      - name: Publish package
        run: deno publish

      - name: attach the browser bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" browser/mqtt5.mjs --clobber
